<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regência dos Tronos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
        <h1 class="titulo">REGÊNCIAS DOS 12 TRONOS CAIDOS</h1>
       
        <div class="mes-atual" id="mesAtual">Junho 2026</div>
        <div id="calendar">
        <!-- Calendário gerado pelo JS -->
        </div>

<div id="regenciaAtual" class="regencia-atual">
    👑 Regência:
    <strong id="textoRegencia">Carregando...</strong>
</div>

<div class="botoes">
    <button id="btnAtual">👑 Analisar Regência Atual</button>
    <button id="btnData">📅 Ver Regência de Outra Data</button>
</div>

<div id="seletorData" style="display:none; margin-top:20px; text-align:center;">
    <input type="date" id="dataEscolhida">
    <button id="consultarData">Consultar</button>
</div>

            <!-- Seção Lilith -->
        <div class="lilith-section">
            <h2 class="lilith-titulo">⚡ HORÁRIOS DE INTENSIDADE - LILITH ⚡</h2>
            
            <!-- LINHA ÚNICA DO DIA ATUAL -->
            <div class="lilith-hoje" id="lilithHoje">
                <!-- Gerado pelo JavaScript -->
            </div>

            <div class="dias-lilith" id="lilithHorarios">
                <!-- Todos os dias (grade) -->
            </div>
        </div>
    
</div>
    <script src="script.js"></script>
</body>
</html>
