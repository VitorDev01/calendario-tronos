<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regência dos Tronos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="titulo">REGÊNCIAS DOS TRONOS</h1>
        <p class="subtitulo">Calendário De Regências - 12 Tronos Caídos</p>
        
        <div class="mes-atual" id="mesAtual">Junho 2026</div>
        
        <div id="calendar">
            <!-- Calendário gerado pelo JS -->
        </div>

        <div class="botoes">
            <button id="btnAtual">👑 Analisar Regência Atual</button>
            <button id="btnData">📅 Ver Regência de Outra Data</button>
        </div>

        <div id="seletorData" style="display:none; margin-top:20px; text-align:center;">
            <input type="date" id="dataEscolhida">
            <button id="consultarData">Consultar</button>
        </div>

        <div class="resultado">
            <div class="imagem-box">
                <img src="img/gemeos.jpg" alt="Regência Atual" id="imgRegencia">
            </div>
            <div class="dados">
                <h2 id="signoTitulo">♊ GÊMEOS</h2>
                <div class="info"><strong>Elemento:</strong> <span id="elemento">Ar</span></div>
                <div class="info"><strong>Qualidade:</strong> <span id="qualidade">Mutável</span></div>
                <div class="trono" id="trono">👑 ATENA</div>
                <div class="descricao" id="descricao">A Soberba e a Estratégia</div>
                
                <div class="contador">
                    <h3>Próxima mudança de regência</h3>
                    <p id="contador">12 dias • 08 horas • 41 minutos</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
